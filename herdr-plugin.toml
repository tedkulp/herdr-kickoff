id = "kickoff"
name = "Kickoff"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Popup form to open a directory as a new workspace with a chosen coding-agent harness, in place or in a git worktree. Config: $(herdr plugin config-dir kickoff)/config.toml"
platforms = ["linux", "macos"]

[[build]]
command = ["bash", "herdr/install.sh"]

[[actions]]
id = "open"
title = "New workspace (Kickoff)"
contexts = ["global", "workspace", "tab", "pane"]
command = ["bin/herdr-kickoff", "action"]

[[panes]]
id = "launcher"
title = "New workspace"
placement = "popup"
width = "70%"
height = "60%"
command = ["bin/herdr-kickoff", "launcher"]
