name: release

# Cuts a release from main, by hand: `gh workflow run release.yml`, optionally
# with `-f version=X.Y.Z`. Without a version, the next one comes from the
# conventional commits since the last release. The [Unreleased] section of
# CHANGELOG.md becomes that version and the release notes; Cargo.toml,
# Cargo.lock and herdr-plugin.toml are bumped; the release commit is tagged and
# published, then the binaries workflow attaches the prebuilt binaries.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.3.0). Leave empty to work it out from the commits."
        required: false
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: publish
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/release.py prepare "$VERSION" "$RUNNER_TEMP/notes.md")
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore: release $version"
          git tag "v$version"
          git push --atomic origin HEAD:main "v$version"
          gh release create "v$version" --title "v$version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  binaries:
    needs: release
    uses: ./.github/workflows/binaries.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
