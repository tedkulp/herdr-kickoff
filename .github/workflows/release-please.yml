name: release-please

# On every push to main, keep a release PR up to date: it bumps the version in
# Cargo.toml, Cargo.lock and herdr-plugin.toml and adds the conventional
# commits since the last release to CHANGELOG.md. Merging that PR tags the
# release and publishes it on GitHub, then the release workflow attaches the
# prebuilt binaries.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
