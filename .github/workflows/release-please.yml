name: release-please

# On every push to main, keep a release PR up to date: it bumps the version in
# Cargo.toml, Cargo.lock and herdr-plugin.toml, and the changelog job turns the
# hand-written [Unreleased] section of CHANGELOG.md into that version. Merging
# the PR tags the release and publishes it on GitHub, then the release workflow
# attaches the prebuilt binaries.
on:
  push:
    branches: [main]

# The changelog job pushes to the release PR branch that release-please rewrites.
concurrency: release-please

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr_branch: ${{ fromJSON(steps.rp.outputs.pr || '{}').headBranchName }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  changelog:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - name: Move [Unreleased] into the release version
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          python3 scripts/changelog.py release "$version"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "docs: changelog for $version"
          git push

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
