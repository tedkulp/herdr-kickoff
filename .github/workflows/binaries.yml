name: binaries

# Builds the plugin binary for each supported platform and attaches it, with a
# .sha256 checksum, to the GitHub release for `tag`. herdr/install.sh
# downloads these on `herdr plugin install`. Runs after the release workflow
# publishes a release, or by hand for an existing tag.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach binaries to (e.g. v0.2.0)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach binaries to (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # musl builds are static, so they run on any Linux distro.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --locked
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          asset=herdr-kickoff-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/herdr-kickoff "$asset"
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            herdr-kickoff-${{ matrix.target }}
            herdr-kickoff-${{ matrix.target }}.sha256
